schema_version: 1

context:
  version: "0.1.5"

package:
  name: r-yr
  version: ${{ version }}

source:
  url: https://github.com/y-crdt/yr/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 2dc6115e10f45d66cad8e0cc775e47d7bb651a0000af07a498a847cc5f3f2897

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
  script:
    env:
      NOT_CRAN: "1"
      DISABLE_AUTOBREW: "1"
      EXTENDR_SKIP_BUILD_WRAPPERS: "1"
    content:
      - if: unix
        then:
          - |
            # Make libR findable for Cargo and R wrapper scripts
            export RUSTFLAGS="-C link-arg=-L${PREFIX}/lib/R/lib ${RUSTFLAGS}"
            export LD_LIBRARY_PATH="${PREFIX}/lib/R/lib:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="${PREFIX}/lib/R/lib:${DYLD_LIBRARY_PATH:-}"

            ${R} CMD INSTALL --build . ${R_ARGS}

            # Bundle third party licenses from statically linked crates
            cd src/rust
            cargo-bundle-licenses --format yaml --output "${SRC_DIR}/THIRDPARTY.yml"
      - if: win
        then:
          - |
            @rem R on conda-forge Windows is built with Rtools (MinGW), so Rust
            @rem must target the GNU ABI. tools/config.R / Makevars.win.in honor
            @rem CARGO_BUILD_TARGET (paired with rust-std-x86_64-pc-windows-gnu).
            set "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu"

            @rem Point Rust at R's import library (libR) rem build links
            @rem raw-dylib crates (windows-targets, parking_lot_core) need
            @rem dlltool; conda-forge binutils ships it target-prefixed only
            set "RUSTFLAGS=-L native=%PREFIX%/lib/R/bin/x64 -l R -C dlltool=x86_64-w64-mingw32-dlltool.exe"

            "%R%" CMD INSTALL --build .
            if %ERRORLEVEL% neq 0 exit 1

            @rem Bundle third party licenses from statically linked crates
            cd src\rust
            cargo-bundle-licenses --format yaml --output "%SRC_DIR%\THIRDPARTY.yml"
            if %ERRORLEVEL% neq 0 exit 1

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      else:
        # Provides the MinGW toolchain matching conda-forge's Rtools-built R.
        - gcc
        - rust-std-x86_64-pc-windows-gnu
    - ${{ compiler('rust') }}
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - cargo-bundle-licenses
    - if: unix
      then:
        - autoconf
        - automake
        - pkg-config
        - make
      else:
        - m2-autoconf
        - m2-automake-wrapper
        - m2-coreutils
        - m2-filesystem
        - m2-grep
        - m2-make
        - m2-pkg-config
        - m2-sed
        - m2-zip
  host:
    - r-base
  run:
    - r-base

tests:
  - r:
      libraries:
        - yr
  - script:
      - Rscript -e 'yr::Doc$new()'

about:
  homepage: https://github.com/y-crdt/yr
  summary: Y-CRDT Bindings to R
  description: |
    Provides R bindings to y-crdt, a Rust implementation of the Yjs CRDT
    (Conflict-free Replicated Data Type) framework.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/y-crdt/yr

extra:
  recipe-maintainers:
    - AntoinePrv
